name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Node and Chromium extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      # The extension fixture uses full Chromium, not chromium-headless-shell.
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      # Builds dist/ first. Fixtures start and stop their own local HTTP servers.
      - name: Build extension and run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
